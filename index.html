<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Khám Bệnh - PHÒNG KHÁM NỘI BSCK1 LÊ HOÀNG PHI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-4" x-data="patientApp()">
    <div class="max-w-2xl mx-auto space-y-6 mt-4">
        
        <!-- QR Code -->
        <div class="bg-white p-4 rounded-2xl shadow-md border border-slate-200 flex flex-col sm:flex-row items-center gap-4">
            <div class="bg-slate-50 p-2 border rounded-xl">
                <img :src="'https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=' + encodeURIComponent(currentUrl)" class="w-28 h-28">
            </div>
            <div>
                <span class="bg-blue-100 text-blue-800 text-[10px] font-bold px-2 py-0.5 rounded-full">QUÉT MÃ ĐỂ ĐẶT KHÁM</span>
                <h2 class="text-xs font-bold text-slate-700 mt-1">Dùng điện thoại quét mã để đăng ký khám bệnh</h2>
            </div>
        </div>

        <!-- Form Đăng Ký -->
        <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-200 space-y-4">
            <div class="text-center border-b pb-3">
                <h1 class="text-lg font-bold text-blue-900 uppercase">PHÒNG KHÁM NỘI BSCK1 LÊ HOÀNG PHI</h1>
            </div>
            <form @submit.prevent="registerPatient()" class="space-y-3 text-xs">
                <input type="date" x-model="regForm.examDate" required class="w-full px-3 py-2 border rounded">
                <input type="text" x-model="regForm.patientName" required placeholder="Họ tên bệnh nhân..." class="w-full px-3 py-2 border rounded">
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" x-model="regForm.birthYear" required placeholder="Năm sinh..." class="w-full px-3 py-2 border rounded">
                    <select x-model="regForm.gender" class="w-full px-3 py-2 border rounded">
                        <option value="Nam">Nam</option><option value="Nữ">Nữ</option>
                    </select>
                </div>
                <select x-model="regForm.symptoms" class="w-full px-3 py-2 border rounded font-semibold text-blue-900">
                    <option value="Khám bệnh">Khám bệnh</option>
                    <option value="Xét nghiệm">Xét nghiệm</option>
                </select>
                <button type="submit" class="w-full bg-blue-700 text-white font-bold py-3 rounded-lg">XÁC NHẬN ĐĂNG KÝ</button>
            </form>
        </div>

        <!-- Danh Sách (Bảo vệ bằng mật khẩu) -->
        <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-200">
            <h2 class="text-sm font-bold uppercase mb-4 flex items-center gap-2">
                <i class="fa-solid fa-list text-emerald-600"></i> Danh Sách Bệnh Nhân
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-xs text-left">
                    <thead><tr class="bg-slate-100 uppercase"><th class="p-2">STT</th><th class="p-2">Tên</th><th class="p-2">Nhu cầu</th><th class="p-2 text-center">Thao tác</th></tr></thead>
                    <tbody>
                        <template x-for="item in filteredQueue" :key="item.id">
                            <tr class="border-b" :class="item.isCompleted ? 'bg-emerald-50' : ''">
                                <td class="p-2 font-bold" x-text="item.stt"></td>
                                <td class="p-2" :class="item.isCompleted ? 'line-through text-slate-400' : ''" x-text="item.patientName"></td>
                                <td class="p-2" x-text="item.symptoms"></td>
                                <td class="p-2 text-center flex justify-center gap-2">
                                    <button @click="toggleStatus(item.id)" class="text-lg" :class="item.isCompleted ? 'text-emerald-600' : 'text-slate-300'"><i class="fa-solid fa-check-circle"></i></button>
                                    <button @click="deleteItem(item.id)" class="text-red-500 text-lg"><i class="fa-solid fa-trash-can"></i></button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function patientApp() {
            return {
                currentUrl: 'https://phongkhambsphi.github.io/dangkykb/',
                filterDate: new Date().toISOString().split('T')[0],
                regForm: { patientName: '', birthYear: '', gender: 'Nam', symptoms: 'Khám bệnh', examDate: new Date().toISOString().split('T')[0] },
                queue: JSON.parse(localStorage.getItem('pk_reg_queue') || '[]'),
                
                checkAdmin() {
                    const pass = prompt("Nhập mật khẩu Admin:");
                    return pass === "123"; // MẬT KHẨU CỦA BẠN LÀ 123
                },

                get filteredQueue() { return this.queue.filter(i => i.examDate === this.filterDate); },

                registerPatient() {
                    const newItem = { id: Date.now(), stt: this.filteredQueue.length + 1, ...this.regForm, isCompleted: false };
                    this.queue.unshift(newItem);
                    localStorage.setItem('pk_reg_queue', JSON.stringify(this.queue));
                    alert("Đăng ký thành công!");
                    this.regForm.patientName = '';
                },

                toggleStatus(id) {
                    if(!this.checkAdmin()) return alert("Sai mật khẩu!");
                    const item = this.queue.find(i => i.id === id);
                    item.isCompleted = !item.isCompleted;
                    localStorage.setItem('pk_reg_queue', JSON.stringify(this.queue));
                },

                deleteItem(id) {
                    if(!this.checkAdmin()) return alert("Sai mật khẩu!");
                    if(confirm("Xóa bệnh nhân này?")) {
                        this.queue = this.queue.filter(i => i.id !== id);
                        localStorage.setItem('pk_reg_queue', JSON.stringify(this.queue));
                    }
                }
            }
        }
    </script>
</body>
</html>
